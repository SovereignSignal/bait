name: CI e2e
# Both Playwright suites (smoke on the October 8 sample, representative on the dated replay fixture). The most
# expensive job, so it runs on pushes to main and on pull requests that are ready for review, not on drafts and
# not for Dependabot; mark a PR ready (or push to it once ready) to run it. One Next build serves both suites: a
# fresh copy of .next is restored between them so no ISR page from the sample dataset is reused.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/ci-e2e.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["web/**", ".github/workflows/ci-e2e.yml"]
concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      # The browser download (~150 MB) is keyed on the lockfile, which pins the Playwright version; the OS packages
      # are installed each time (seconds) and `playwright install` is a no-op when the browser is already present.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run build && cp -a .next .next-fresh
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - run: cd web && npm run e2e
        env: { CI: "true", NEXT_TELEMETRY_DISABLED: "1" }
      - run: cd web && rm -rf .next && mv .next-fresh .next && npm run e2e
        env: { CI: "true", NEXT_TELEMETRY_DISABLED: "1", BAIT_E2E_REPRESENTATIVE: "1" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-results, path: web/test-results, if-no-files-found: ignore }

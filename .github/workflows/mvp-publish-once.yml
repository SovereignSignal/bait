name: Apply reviewed MVP patch once
on:
  pull_request:
    paths:
      - '.github/workflows/mvp-publish-once.yml'
      - 'scripts/.mvp-bundle/**'
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'SovereignSignal/bait' && github.event.pull_request.head.repo.full_name == 'SovereignSignal/bait' && github.head_ref == 'mvp/verification-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Validate and apply exact reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          packed=''.join(Path(f'scripts/.mvp-bundle/{i}.b64').read_text().strip() for i in range(4))
          if len(packed) != 27304: raise SystemExit(f'Unexpected bundle length: {len(packed)}')
          patch=gzip.decompress(base64.b64decode(packed,validate=True))
          expected='557a2ee021426d0dd045ca0f5b40f992ca20f5c8cdab98f52bd8b1731fb535f0'
          if hashlib.sha256(patch).hexdigest()!=expected: raise SystemExit('Patch checksum mismatch')
          names=[]
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  a,b=line[len('diff --git '):].split(' ')
                  if a[2:]!=b[2:] or not b.startswith(('b/web/','b/pipeline/')) or '..' in Path(b).parts: raise SystemExit('Disallowed patch path')
                  names.append(b[2:])
          if len(names)!=23: raise SystemExit('Unexpected file count')
          p=Path('/tmp/bait-reviewed.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          print('Applied reviewed patch',expected,'to',len(names),'files')
          PY
          git config user.name 'Bait MVP verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate coverage, preserve research records, validate identity links and routing claims'
          git push origin HEAD:refs/heads/mvp/verification-2026-10-14
          git rev-parse HEAD

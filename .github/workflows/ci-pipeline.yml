name: CI pipeline
# Python tests against SQLite and a Postgres 17 service. Runs only when the pipeline, the schema or a shared fixture
# changes; a newer push to the same PR cancels the run in progress.
on:
  push:
    branches: [main]
    paths: ["pipeline/**", "db/**", "fixtures/**", ".github/workflows/ci-pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", "db/**", "fixtures/**", ".github/workflows/ci-pipeline.yml"]
concurrency:
  group: ci-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: bait }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: cd pipeline && python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://postgres:ci@localhost:5432/bait" }

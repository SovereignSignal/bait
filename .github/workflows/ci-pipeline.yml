name: CI pipeline
# Python tests against SQLite and a Postgres 17 service. Runs only when the pipeline, the schema or a shared fixture
# changes; a newer push to the same PR cancels the run in progress.
on:
  push:
    branches: [main]
    paths: ["pipeline/**", "db/**", "fixtures/**", ".github/workflows/ci-pipeline.yml"]
  pull_request:
    paths: ["pipeline/**", "db/**", "fixtures/**", ".github/workflows/ci-pipeline.yml"]
concurrency:
  group: ci-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: bait }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: cd pipeline && python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://postgres:ci@localhost:5432/bait" }
  # Dependabot's pipeline-minor group merges itself once the suite passes; majors stay manual. See ci-web.yml.
  automerge:
    needs: pipeline
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/pipeline/pipeline-minor-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write, pull-requests: write }
    steps:
      - run: gh pr merge "$PR" --squash --match-head-commit "$SHA" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

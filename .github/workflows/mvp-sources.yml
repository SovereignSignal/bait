name: Historical MVP source reconciliation (manual)
# One-off October 15 baseline; the referenced artifact expires October 22.
# This does not validate a candidate application build.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bait-mvp-evidence
          path: evidence
          run-id: 38665788970
          github-token: ${{ github.token }}
      - run: python scripts/mvp-source-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bait-mvp-sources
          path: evidence/
          retention-days: 7

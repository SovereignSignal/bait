name: CI web
# Unit tests, typecheck and a production build. Runs only when web/ or a shared fixture changes; a newer push to the
# same PR cancels the run in progress.
on:
  push:
    branches: [main]
    paths: ["web/**", "fixtures/**", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["web/**", "fixtures/**", ".github/workflows/ci-web.yml"]
concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: cd web && npm test
      - run: cd web && npx tsc --noEmit
      - run: cd web && npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

# Weekly, grouped: at most one minor/patch PR and one major PR per ecosystem, and one PR for all actions, so a
# refresh is a handful of CI runs rather than one per package. Dependabot PRs skip the e2e job (ci-e2e.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web-minor: { update-types: [minor, patch] }
      web-major: { update-types: [major] }
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /pipeline
    schedule: { interval: weekly, day: monday }
    groups:
      pipeline-minor: { update-types: [minor, patch] }
      pipeline-major: { update-types: [major] }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    open-pull-requests-limit: 1
